name: deploy-api

# Builds the API and worker images and pushes them to GHCR:
# main -> :staging, a published release -> :production (+ :<version>). Every build also gets :sha-<short>.
on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/shared/**
      - package-lock.json
      - .github/workflows/deploy-api.yml
  release:
    types: [published]

permissions:
  contents: read
  packages: write

# One build per environment at a time, so :staging always ends on the newest push.
concurrency:
  group: deploy-api-${{ github.event_name == 'release' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'production' || 'staging' }}
    strategy:
      matrix:
        target: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/grocer-${{ matrix.target }}
          tags: |
            type=raw,value=${{ github.event_name == 'release' && 'production' || 'staging' }}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
