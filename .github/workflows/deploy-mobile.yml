name: deploy-mobile

# Starts EAS cloud builds of Android only, iOS is not set up yet (the runner only triggers them, --no-wait):
# main -> staging profile (internal distribution), a published release -> production profile, submitted to the stores.
# App variables and secrets live in EAS, not GitHub: the staging profile reads the EAS "preview" environment,
# production reads "production" (eas.json). Run this by hand (Actions > deploy-mobile > Run workflow) after changing them.
on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/shared/**
      - docs/design/tokens.json
      - package-lock.json
      - .github/workflows/deploy-mobile.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (github.event_name == 'release' && 'production' || 'staging') }}
    env:
      DEPLOY_ENV: ${{ inputs.environment || (github.event_name == 'release' && 'production' || 'staging') }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        working-directory: .
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Start EAS builds
        run: |
          if [ "$DEPLOY_ENV" = production ]; then
            eas build --platform android --profile production --auto-submit --non-interactive --no-wait
          else
            eas build --platform android --profile staging --non-interactive --no-wait
          fi
