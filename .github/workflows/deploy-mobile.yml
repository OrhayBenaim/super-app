name: deploy-mobile

# Builds Android only, iOS is not set up yet, on this runner (eas build --local), so it uses no EAS cloud build quota:
# main -> staging profile, uploaded to EAS for internal distribution; a published release -> production profile, submitted to Google Play.
# App variables and secrets live in EAS, not GitHub: the staging profile reads the EAS "preview" environment,
# production reads "production" (eas.json). Secret-visibility EAS variables only reach EAS cloud builders, so the Sentry
# upload token comes from the GitHub secret SENTRY_AUTH_TOKEN instead. Run this by hand (Actions > deploy-mobile > Run workflow) after changing them.
on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/shared/**
      - docs/design/tokens.json
      - package-lock.json
      - .github/workflows/deploy-mobile.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (github.event_name == 'release' && 'production' || 'staging') }}
    env:
      DEPLOY_ENV: ${{ inputs.environment || (github.event_name == 'release' && 'production' || 'staging') }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        working-directory: .
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # The release tag (v1.2.3) is the app version, so nothing is committed back to main.
      # versionCode needs no commit either: EAS keeps it remotely (appVersionSource: remote) and autoIncrement bumps it.
      - name: Set the app version from the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tag $TAG is not vX.Y.Z"; exit 1; }
          jq --arg v "$version" '.expo.version = $v' app.json > app.json.tmp && mv app.json.tmp app.json
      - name: Build and ship
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ "$DEPLOY_ENV" = production ]; then
            eas build --local --platform android --profile production --non-interactive --output app.aab
            eas submit --platform android --profile production --path app.aab --non-interactive
          else
            eas build --local --platform android --profile staging --non-interactive --output app.apk
            eas upload --platform android --build-path app.apk --non-interactive
          fi
      # Kept so a failed submit or upload can be finished by hand without a rebuild (production already bumped versionCode).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ env.DEPLOY_ENV }}
          path: apps/mobile/app.*
          if-no-files-found: ignore
